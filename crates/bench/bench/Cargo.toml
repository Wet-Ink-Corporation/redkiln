[package]
name = "bench"
description = "The Bench CLI (formerly anneal): deterministic checks behind the rk-bench plugin's hooks and skills."
version = "0.0.5"              # the plugin's own version (AGENTS.md, Versions and tags)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors = ["Ryan Britton <ryan.britton@wet-ink.net>"]

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
# Core's half of the contract: the `bench.*` payloads as Core payloads, their tags and `decode`.
bench-contract = { workspace = true, features = ["core"] }
clap = { workspace = true }
# The suite store, its location, envelopes, ids and journal lines (Move 2 step 3): bench never
# opens SQLite itself.
redkiln-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
