[package]
name = "bench"
description = "The Bench CLI (formerly anneal): deterministic checks behind the rk-bench plugin's hooks and skills."
version = "0.0.5"              # the plugin's own version (AGENTS.md, Versions and tags)
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors = ["Ryan Britton <ryan.britton@wet-ink.net>"]

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
bench-contract = { workspace = true }
bench-ledger = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
