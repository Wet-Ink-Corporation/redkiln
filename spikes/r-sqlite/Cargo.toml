# R-SQLITE: the eight-writer contention spike against Core's TRUNCATE store (SPEC ST-05, ST-09).
# Its own workspace, outside the suite's: never shipped and never a member, so it adds no crate,
# edge or dependency to the suite's workspace (H-16). It links redkiln-core by path and runs
# Core's own opener and append path, unchanged.
[package]
name = "r-sqlite"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
redkiln-core = { path = "../../crates/core/redkiln-core" }
# Core's own pin, for the read-only integrity check through its rusqlite re-export.
happenstance-sqlite = { version = "=0.4.5", default-features = false, features = ["sync"] }
anyhow = "1.0.98"
serde = { version = "1.0.219", default-features = false, features = ["std", "derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
