# Moves cloud sessions' inbox branches into journal refs (SPEC JR-07, D8, D13). A Claude Code
# cloud session cannot push refs/redkiln/journal/*, so its Stop pushes redkiln/inbox/<session>
# instead; this moves that branch into refs/redkiln/journal/<session> and deletes it. Runbook:
# docs/weigh-in/journal-relay.md.
#
# GITHUB_TOKEN only, with contents: write; no secret. Its pushes start no workflow, so the relay
# never triggers itself. Exit 1 leaves the branch in place and turns the run red (JR-07: it
# reports). Actions are pinned to the SHAs ci.yml pins (crates/weigh-in/weighin/tests/it/
# relay_workflow.rs checks both).
name: redkiln-journal-relay
on:
  push:
    branches: ['redkiln/inbox/**']

permissions:
  contents: write

concurrency:
  group: redkiln-journal-relay-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  relay:
    # A deleted branch (the relay's own delete included) has nothing to move.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The default branch is built, never the inbox commit, which holds only a journal file.
      # checkout keeps GITHUB_TOKEN in the clone's local config, which Core's git reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-28
        with:
          toolchain: "1.98.1"  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false       # an inbox branch's cache would serve nobody (D8)
      # No CARGO_BUILD_WARNINGS: deny here, so a warning cannot stop a relay.
      - run: cargo build -p weighin --locked
      - run: target/debug/weighin journal relay --json "$GITHUB_REF_NAME"
