# Moves cloud sessions' inbox branches into journal refs (SPEC JR-07, D8, D13). A Claude Code
# cloud session cannot push refs/redkiln/journal/*, so its Stop pushes redkiln/inbox/<session>
# instead; this moves that branch into refs/redkiln/journal/<session> and deletes it. Runbook:
# docs/weigh-in/journal-relay.md.
#
# GITHUB_TOKEN only, with contents: write; no secret. Its pushes and deletes start no workflow,
# so the relay never triggers itself. Exit 1 leaves the branch in place and turns the run red
# (JR-07: it reports). Actions are pinned to the SHAs ci.yml pins (crates/weigh-in/weighin/
# tests/it/relay_workflow.rs checks both). Every run is a cold build: no cache is restored or
# saved (D8 A, amended 2026-11-08).
name: redkiln-journal-relay
# '*' matches no '/', so a nested name under redkiln/inbox/ starts no run.
on:
  push:
    branches: ['redkiln/inbox/*']

permissions:
  contents: write

# One running and one pending run per branch; a newer push replaces the pending one. That loses
# nothing: a run relays the branch tip it reads when it starts.
concurrency:
  group: redkiln-journal-relay-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  relay:
    # A branch deleted by anyone but this workflow (whose deletes start no run) has nothing to
    # move.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The default branch is built, never the inbox commit, which holds only a journal file.
      # checkout keeps GITHUB_TOKEN in the clone's local git config, which Core's git reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-28
        with:
          toolchain: "1.98.1"  # keep in sync with rust-toolchain.toml
      # No CARGO_BUILD_WARNINGS: deny here, so a warning cannot stop a relay.
      - run: cargo build -p weighin --locked
      - run: target/debug/weighin journal relay --json "$GITHUB_REF_NAME"
