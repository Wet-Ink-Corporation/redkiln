# The redkiln workspace: one Cargo workspace for the whole suite (AGENTS.md).
# Lint tables are temper 1.4.0's template; changing a level is H-05. Members opt in with
#
#   [lints]
#   workspace = true
#
# Escape-hatch lints are "deny"; style and pedantic lints are "warn", and the gate and CI deny
# warnings, so nothing merges with one.

[workspace]
resolver = "3"
# The layout of AGENTS.md: Core under crates/core/, kits under crates/kits/, each plugin's crates
# under crates/<plugin>/, dev tools under tools/. `cargo xtask layers` checks that every member
# sits in one of these places and that its edges point the allowed way. Cargo refuses a glob that
# matches nothing or a folder without a manifest, so the first crate of each layer adds its
# `crates/<layer>/*` glob here, and tools are listed one by one (tools/ also holds scripts).
members = ["crates/core/*", "crates/knowledge/*", "crates/weigh-in/*", "tools/xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"        # MSRV equals the toolchain pin, as in weigh-in and anneal (MOD-01);
                               # raising it is H-16
version = "0.1.0"              # per-package versions arrive with each plugin's move
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wet-Ink-Corporation/redkiln"
publish = false                # members inherit it (publish.workspace = true); turning it on is H-16

[workspace.dependencies]
# Declare every dependency here once (ARC-12): a full caret floor at the oldest release whose
# API you use, default features off plus the baseline set. Members write
#   thiserror = { workspace = true }
# and may only add `features`.
serde = { version = "1.0.219", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

# Core (SPEC ST-04): every happenstance crate is pinned at =0.6.0, with happenstance-sqlite's
# `sync` feature. 0.4.5 brought the ingest port that keeps a caller's TRUNCATE connection
# (docs/decisions.md, 2026-11-01); 0.6.0 brings rusqlite 0.41 (SQLite 3.54.1, RUSTSEC-2026-0459)
# and happenstance schema 2, which Core migrates on open (ST-08, 2026-11-09). Only Core opens the
# store; weighin writes through Core since #17 part 5a (2026-11-06) and depends on neither
# happenstance crate.
redkiln-core = { path = "crates/core/redkiln-core" }
happenstance-core = { version = "=0.6.0", features = ["serde"] }
happenstance-sqlite = { version = "=0.6.0", features = ["sync"] }
# `.redkiln/suite.toml` (ST-12): parse only, with serde; bounded nesting kept (no `unbounded`).
# Approved 2026-11-02 (docs/decisions.md).
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

# Weigh-In's crates as imported at Move 1 (docs/plan/move-1-weigh-in.md, step 1), with weigh-in
# 1.2.0's requirements; tokio, sha2, clap and time are M1-B.
weighin-core = { path = "crates/weigh-in/weighin-core" }
# Weigh-In's contract (Move 1 step 5): members turn on `core` where they need Core's half.
weighin-contract = { path = "crates/weigh-in/weighin-contract" }
# Knowledge's atom contract (Move 1 step 4): weighin-core renders atoms through it.
knowledge-contract = { path = "crates/knowledge/knowledge-contract" }
tokio = { version = "1", default-features = false, features = ["rt"] }
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tempfile = "3"

# Test-only: validates the SPEC's golden fixtures against their JSON Schemas (Move 1 step 3,
# #18). Default features off: no HTTP, TLS or file resolution; every schema is read from
# spec/schemas/ and handed over as a value. A dev-dependency only, never a normal one
# (Ryan, 2026-11-08, docs/decisions.md).
jsonschema = { version = "0.58.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"                                  # H-01
missing_docs = "warn"                                   # H-15 / API-15
missing_debug_implementations = "warn"                  # API-06
unreachable_pub = "warn"                                # API-14
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"                               # OWN-05
redundant_lifetimes = "warn"                            # OWN-05
let_underscore_drop = "warn"                            # H-10
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
non_ascii_idents = "deny"
ambiguous_negative_literals = "warn"                    # `-1i32.abs()` parses as `-(1i32.abs())`
redundant_imports = "warn"                              # CRF-05: e.g. importing 2024-prelude items

[workspace.lints.clippy]
# Groups: correctness/suspicious/style/complexity/perf deny; pedantic warn.
# nursery, restriction and cargo lints are off unless listed below.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
naive_bytecount = "allow"                               # would push a new dependency (H-16)

# Escape hatches (H-rules): deny outright.
unwrap_used = "deny"                                    # H-02
expect_used = "deny"                                    # H-02
unwrap_in_result = "deny"                               # H-02
panic = "deny"                                          # H-03
todo = "deny"                                           # H-03
unimplemented = "deny"                                  # H-03
unreachable = "deny"                                    # H-03
indexing_slicing = "deny"                               # H-04
string_slice = "deny"                                   # H-04
allow_attributes = "deny"                               # H-05
allow_attributes_without_reason = "deny"                # H-05
dbg_macro = "deny"                                      # H-06
print_stdout = "deny"                                   # H-06 (bins: writeln!(io::stdout().lock(), ..)?)
print_stderr = "deny"                                   # H-06
mem_forget = "deny"                                     # H-07
rc_mutex = "deny"                                       # H-07 / OWN-11
let_underscore_must_use = "deny"                        # H-10
unused_result_ok = "deny"                               # H-10
as_conversions = "deny"                                 # H-11
exit = "deny"                                           # ARC-14: main returns ExitCode

# Idiom and design lints: warn (denied by the gate).
clone_on_ref_ptr = "warn"                               # PERF-11
redundant_clone = "warn"                                # H-08
rc_buffer = "warn"                                      # OWN-15
map_err_ignore = "warn"                                 # ERR-04
str_to_string = "warn"
mod_module_files = "warn"                               # ARC-06
empty_structs_with_brackets = "warn"
format_push_string = "warn"                             # PERF-04
significant_drop_tightening = "warn"                    # PERF-12
cognitive_complexity = "warn"                           # CRF-02
large_futures = "warn"                                  # PERF-05
needless_collect = "warn"                               # PERF-02 / OWN-13
or_fun_call = "warn"                                    # ERR-07 / PERF-04
significant_drop_in_scrutinee = "warn"                  # ASY-14
debug_assert_with_mut_call = "warn"                     # H-03
future_not_send = "warn"                                # ASY-11
too_long_first_doc_paragraph = "warn"                   # API-15
missing_assert_message = "warn"                         # H-03
assertions_on_result_states = "warn"                    # TST-05
renamed_function_params = "warn"                        # API-18
empty_drop = "warn"                                     # ERR-13
negative_feature_names = "warn"                         # API-16
redundant_feature_names = "warn"                        # API-16
cargo_common_metadata = "warn"                          # ARC-01: fires only once a crate can publish

# Profiles live only in this root manifest; cargo ignores member [profile] tables (PERF-09).
# Per-application H-16 decisions, each with a benchmark and a decisions-log entry, never
# template defaults: lto = "fat", opt-level = "s"/"z", panic = "abort", strip = "symbols",
# overflow-checks = true (money domains), a #[global_allocator] (binaries only), PGO/BOLT,
# and target-cpu (a named level, never "native"). Shipped profiles keep debug-assertions off.
[profile.release]
lto = "thin"
codegen-units = 1

# `cargo build --profile profiling`: release code with file:line for profilers.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# `cargo bench`: source lines in profiler output.
[profile.bench]
debug = "line-tables-only"

# Dev and test builds keep file:line in panics and backtraces, but no debugger locals.
# To attach a debugger locally: CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false                                           # dependencies: no debug info
